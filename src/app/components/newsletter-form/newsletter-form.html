@if (sent()) {
  <p class="notice">{{ i18n.t('newsletterOk') }}</p>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="stack" style="gap: 16px">
    <div class="field">
      <label for="nl-email">Email</label>
      <input
        id="nl-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [placeholder]="i18n.t('newsletterPlaceholder')"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="err">{{ i18n.t('invalidEmail') }}</span>
      }
    </div>

    <label class="check">
      <input type="checkbox" formControlName="consent" />
      <span>{{ i18n.t('newsletterConsent') }}</span>
    </label>

    <div>
      <button class="btn" type="submit">{{ i18n.t('newsletterCta') }}</button>
    </div>
  </form>
}
